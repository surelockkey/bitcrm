# The caller's own origin, echoed back on gateway-generated errors. Empty when
# there is no Origin header, and nginx omits an empty add_header.
map $http_origin $cors_origin {
    default $http_origin;
    ""      "";
}

server {
    listen 4000;
    server_name localhost;

    # An unreachable service is a 502/504 that nginx writes itself, and nginx
    # writes it without CORS headers — so the browser refuses to show the
    # response and reports a CORS failure instead. The status is then invisible
    # to the app and to whoever is debugging it: a service being down looks
    # identical to a misconfigured origin.
    #
    # Only nginx's own errors are rewritten. Anything a service answers keeps
    # the headers that service sent, so nothing is ever sent twice — two
    # Access-Control-Allow-Origin values make a browser reject the response
    # outright.
    error_page 502 504 = @upstream_down;

    # Keepalive needs HTTP/1.1 with no Connection: close.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Fail fast instead of hanging for the 60s default when the host route
    # misbehaves — the browser retries far sooner than a user will wait.
    # Short, because the failure mode is a connect that hangs rather than one
    # that refuses. Giving up quickly and trying again beats waiting.
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # A pooled connection can be dead before it is used again: Docker Desktop's
    # port forwarding drops idle host connections without telling either end,
    # so the first request down a reused socket goes nowhere. nginx retries
    # such a request on a fresh connection — but only for idempotent methods
    # unless told otherwise, which is why a GET would succeed and the POST
    # beside it would fail. `non_idempotent` is safe here because the request
    # never reached the service: nothing was executed to be repeated.
    proxy_next_upstream error timeout non_idempotent;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 15s;

    # Unified API docs
    location = /api/docs {
        root /usr/share/nginx/html;
        try_files /docs.html =404;
    }

    # Service routes
    location /api/users {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/crm {
        proxy_pass http://crm_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/deals {
        proxy_pass http://deal_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/inventory {
        proxy_pass http://inventory_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/search {
        proxy_pass http://search_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/telephony {
        proxy_pass http://telephony_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /health {
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }

    # Reached only when a service could not be contacted.
    location @upstream_down {
        default_type application/json;
        # `always` is the point of this block: without it nginx omits these on
        # a non-2xx, which is exactly the case being handled.
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true         always;
        add_header Access-Control-Allow-Headers     "authorization,content-type" always;
        add_header Access-Control-Allow-Methods     "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Cache-Control                    "no-store"   always;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"That service is not responding. If you are running locally, check it is up."}}';
    }
}
