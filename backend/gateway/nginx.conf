upstream user_service {
    server host.docker.internal:4001;
    # Reuse connections. Docker Desktop\'s host networking on macOS drops
    # new host.docker.internal connections under churn, which surfaces as
    # intermittent "upstream timed out while connecting" and a request that
    # simply never answers.
    #
    # Recycled rather than held forever: an idle pooled connection through
    # Docker's port forwarding can go half-open — closed on its side, still
    # ESTABLISHED on the service's — and a service asked to shut down then
    # waits on a socket that will never drain.
    keepalive 16;
    keepalive_timeout 30s;
    keepalive_requests 200;
}

