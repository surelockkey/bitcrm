upstream user_service {
    # `max_fails=0` because there is nowhere to fail over to. With the default
    # (one failure, ten seconds) a single dropped connection takes the service
    # out of service for everybody for ten seconds — which is what "the backend
    # keeps going down" actually was: nginx refusing to try a service that was
    # listening the whole time.
    server host.docker.internal:4001 max_fails=0;
    # Reuse connections. Docker Desktop\'s host networking on macOS drops
    # new host.docker.internal connections under churn, which surfaces as
    # intermittent "upstream timed out while connecting" and a request that
    # simply never answers.
    #
    # Held for a long time on purpose. The failure being avoided is *opening*
    # a connection, not reusing one: nginx's log for this gateway is 65
    # "upstream timed out while connecting" and nothing else. A pool that never
    # empties almost never has to open one. The services that receive constant
    # traffic — telephony, search — never failed for exactly this reason.
    #
    # Safe now that a service's shutdown is time-bounded: a long-lived pooled
    # connection that goes half-open used to hang app.close() forever.
    keepalive 32;
    keepalive_timeout 3600s;
    keepalive_requests 100000;
}

